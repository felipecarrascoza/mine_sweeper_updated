<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050b17">
<title>Mine Sweeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050b17; --panel:#0a1426; --panel2:#0e1c36; --line:#1f4062; --cyan:#4fd8e8; --pink:#ff5c93; --text:#cfe3f1; --muted:#6f93ad;
    --yellow:#ffd166; --red:#ff4d5e; --green:#53e69a; --blue:#4fa8ff;
    --ui:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif; --pix:"Press Start 2P","Courier New",monospace;
    --cell:36px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{min-height:100%}
  body{margin:0;min-height:100vh}
  *,*::before,*::after{font-variant-ligatures:none;font-feature-settings:"liga" 0,"clig" 0,"calt" 0,"dlig" 0;font-kerning:none}
  body{
    font-family:var(--ui);color:var(--text);font-size:16px;letter-spacing:.4px;
    background:radial-gradient(ellipse 90% 60% at 50% -8%,#0c3a55 0%,transparent 62%),linear-gradient(#050b17,#02060e);
    background-attachment:fixed;
    display:flex;padding:40px 16px;overflow-x:hidden;user-select:none;
  }
  button{font-family:inherit;color:inherit}
  .bub{position:fixed;bottom:-20px;background:#8fe8f5;opacity:.25;z-index:0;pointer-events:none;animation:rise linear infinite}
  @keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(14px,-55vh)}100%{transform:translate(-8px,-115vh);opacity:0}}

  .screen{display:none;position:relative;z-index:1;max-width:100%;margin:auto;
    background:#08101fe6;border:2px solid var(--line);border-radius:3px;padding:22px;
    box-shadow:0 0 0 2px #000,0 0 40px #4fd8e814}
  .screen.active{display:block;animation:appIn .45s steps(8)}
  @keyframes appIn{from{opacity:0;transform:translateY(14px)}}
  h1{margin:0 0 14px;font-family:var(--pix);font-weight:400;font-size:18px;text-align:center;text-transform:uppercase}

  /* ---------- menu ---------- */
  #menu{width:720px;text-align:center}
  #menu h1{font-size:42px;line-height:1.15;margin:6px 0 10px;color:#fbf6ff;letter-spacing:2px;
    text-shadow:-3px 0 var(--pink),3px 0 var(--cyan);animation:glitch 5s infinite}
  @keyframes glitch{0%,92%,100%{text-shadow:-3px 0 var(--pink),3px 0 var(--cyan);transform:none}
    94%{text-shadow:-6px 0 var(--pink),6px 0 var(--cyan);transform:translateX(2px)}
    96%{text-shadow:5px 0 var(--pink),-5px 0 var(--cyan);transform:translateX(-2px)}}
  #menu .tagline{display:inline-block;font-family:var(--pix);font-size:22px;line-height:1;letter-spacing:8px;color:#2a0618;background:var(--pink);padding:11px 6px 11px 16px;margin:2px 0 16px;
    box-shadow:5px 5px 0 #a02a56,0 0 26px #ff5c9366;animation:upd 1.4s steps(2) infinite}
  @keyframes upd{50%{filter:brightness(1.3)}}
  #menu .sub{color:var(--muted);margin:0 0 14px;font-size:14px;letter-spacing:1px}
  .label{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:12px}
  .label::before,.label::after{content:"";flex:1;height:2px;background:var(--line)}
  #mixHint{min-height:18px;font-size:14px;color:var(--pink);margin:6px 0 -6px}
  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:4px}
  .mode{
    text-align:left;border:2px solid var(--line);background:var(--panel);color:var(--text);border-radius:3px;padding:14px;
    cursor:pointer;transition:border-color .15s,background .15s,transform .15s,box-shadow .15s;position:relative;
    animation:cardIn .4s both steps(6)}
  .mode:nth-child(2){animation-delay:.05s}.mode:nth-child(3){animation-delay:.1s}.mode:nth-child(4){animation-delay:.15s}
  @keyframes cardIn{from{opacity:0;transform:translateY(12px)}}
  .mode:hover{border-color:var(--cyan);background:var(--panel2);transform:translateY(-2px)}
  .mode.sel{border-color:var(--cyan);background:#0f2b47;box-shadow:0 0 0 1px var(--cyan),0 0 22px #4fd8e833}
  .mode.mixcard{border-style:dashed}
  .mode.mixcard.sel{border-style:solid;border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 0 22px #ff5c9333;background:#2a1030}
  .mode .ic{font-size:28px;display:inline-block}
  .mode:hover .ic{animation:bob .8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .mode b{display:block;font-family:var(--pix);font-size:11px;line-height:1.5;font-weight:400;margin:8px 0 6px;color:#fff}
  .mode .d{font-size:14px;line-height:1.35;color:var(--muted);display:block}
  .levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .lvl{border:2px solid var(--line);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:3px;
    font-family:var(--pix);font-weight:400;font-size:10px;line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
  .lvl small{display:block;font-family:var(--ui);font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
  .lvl:hover{border-color:var(--cyan);transform:translateY(-2px)}
  .lvl.sel{border-color:var(--cyan);background:#0f2b47;box-shadow:0 0 0 1px var(--cyan),0 0 18px #4fd8e833}
  .lvl.sel small{color:#a9d6e2}
  .play{margin-top:26px;width:100%;max-width:520px;border:3px solid var(--cyan);padding:16px 20px;border-radius:3px;font-family:var(--pix);font-size:16px;letter-spacing:3px;
    color:var(--cyan);background:#0b1d36;cursor:pointer;transition:.15s;box-shadow:0 0 22px #4fd8e822}
  .play:hover{background:#12305a;box-shadow:0 0 30px #4fd8e855;color:#fff}
  .play:active{transform:translateY(2px)}

  /* dificuldades: cada uma tem sua cor e, quanto mais difícil, mais radical o efeito ao passar o mouse */
  .lvl.diff .px{width:24px;height:24px;vertical-align:-7px;margin-right:6px}
  .lvl.diff{transition:border-color .2s,background .2s,color .2s,box-shadow .2s}
  .lvl.d-easy.sel{border-color:#53e69a;background:#0e2e24;box-shadow:0 0 0 1px #53e69a,0 0 18px #53e69a33}
  .lvl.d-medium.sel{border-color:#ffd166;background:#33290e;box-shadow:0 0 0 1px #ffd166,0 0 18px #ffd16633}
  .lvl.d-hard.sel{border-color:#c58bff;background:#25103f;box-shadow:0 0 0 1px #c58bff,0 0 18px #c58bff44}
  .lvl.d-insane.sel{border-color:#ff4d5e;background:#3a0a12;box-shadow:0 0 0 1px #ff4d5e,0 0 22px #ff4d5e66}
  /* easy: verde, pulinho suave */
  .lvl.d-easy:hover{border-color:#53e69a;background:#0f3a2b;color:#c9ffe3;box-shadow:0 0 18px #53e69a55;animation:dEasy .8s ease-in-out infinite}
  .lvl.d-easy:hover .px{animation:eBounce .6s ease-in-out infinite}
  @keyframes dEasy{50%{transform:translateY(-4px)}}
  @keyframes eBounce{50%{transform:translateY(-4px) scale(1.15)}}
  /* medium: amarelo, balança */
  .lvl.d-medium:hover{border-color:#ffd166;background:#3a2f0f;color:#fff0c2;box-shadow:0 0 20px #ffd16666;animation:dMed .5s ease-in-out infinite}
  .lvl.d-medium:hover .px{animation:eWobble .4s ease-in-out infinite}
  @keyframes dMed{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg) translateY(-2px)}}
  @keyframes eWobble{0%,100%{transform:rotate(-14deg) scale(1.1)}50%{transform:rotate(14deg) scale(1.1)}}
  /* hard: roxo, treme com glitch RGB */
  .lvl.d-hard:hover{border-color:#c58bff;background:#2a1248;color:#f0dcff;box-shadow:0 0 26px #c58bff88,inset 0 0 14px #c58bff44;animation:dHard .22s steps(2) infinite;text-shadow:-2px 0 #ff5c93,2px 0 #4fd8e8}
  .lvl.d-hard:hover .px{animation:eGlitch .3s steps(2) infinite}
  @keyframes dHard{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,2px)}}
  @keyframes eGlitch{0%{transform:translate(0,0) scale(1.25);filter:drop-shadow(-3px 0 #ff5c93) drop-shadow(3px 0 #4fd8e8)}50%{transform:translate(2px,-2px) scale(1.35) rotate(-6deg);filter:drop-shadow(3px 0 #ff5c93) drop-shadow(-3px 0 #4fd8e8) hue-rotate(40deg)}100%{transform:translate(-2px,2px) scale(1.25);filter:drop-shadow(-3px 0 #ff5c93) drop-shadow(3px 0 #4fd8e8)}}
  /* insane: vermelho/fogo, tremor violento, caveira girando, fundo em chamas */
  .lvl.d-insane:hover{border-color:#ff4d5e;color:#fff;box-shadow:0 0 34px #ff4d5eaa,0 0 0 2px #000,inset 0 0 18px #ff4d5e88;text-shadow:-3px 0 #ff5c93,3px 0 #4fd8e8;
    background:repeating-linear-gradient(135deg,#3a0a12 0 8px,#8a1424 8px 16px);background-size:46px 46px;animation:dInsane .12s steps(2) infinite,fire .5s linear infinite}
  .lvl.d-insane:hover .px{animation:eSkull .5s steps(8) infinite}
  .lvl.d-insane:hover small{color:#ffd3d6}
  @keyframes dInsane{0%{transform:translate(-4px,2px) rotate(-1.2deg)}25%{transform:translate(4px,-3px) rotate(1.2deg) scale(1.04)}50%{transform:translate(-5px,-2px) rotate(-1.6deg)}75%{transform:translate(5px,3px) rotate(1.6deg) scale(1.04)}100%{transform:translate(-3px,-3px) rotate(-1deg)}}
  @keyframes fire{to{background-position:46px 0}}
  @keyframes eSkull{0%{transform:rotate(0) scale(1.5);filter:drop-shadow(-4px 0 #ff5c93) drop-shadow(4px 0 #4fd8e8)}50%{transform:rotate(180deg) scale(1.8);filter:drop-shadow(4px 0 #ff5c93) drop-shadow(-4px 0 #4fd8e8) brightness(1.6)}100%{transform:rotate(360deg) scale(1.5);filter:drop-shadow(-4px 0 #ff5c93) drop-shadow(4px 0 #4fd8e8)}}
  .qm{width:22px;height:22px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:10px;line-height:1;
    background:#0b1d36;border:2px solid var(--line);color:var(--cyan);cursor:help;transition:.15s;flex:none}
  .qm:hover{background:var(--cyan);color:#04111f;border-color:var(--cyan)}
  .mode .qm{position:absolute;top:10px;right:10px;z-index:2}
  .lvl .qm{margin-left:8px;vertical-align:middle}
  .mode.mixing::before{content:"";position:absolute;top:12px;left:12px;width:18px;height:18px;border:2px solid var(--line);border-radius:2px;background:#050b17}
  .mode.mixing.sel::before{background:var(--cyan);content:"✓";color:#04111f;font-weight:600;font-size:13px;line-height:14px;text-align:center;border-color:var(--cyan)}
  .mode.mixing .ic{margin-left:26px}

  /* ---------- jogo ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .gtitle{text-transform:uppercase;font-family:var(--pix);font-size:13px;color:#fbf6ff;text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);animation:glitch 5s infinite;letter-spacing:1px}
  @media(max-width:620px){.gtitle{display:none}}
  .tag{font-weight:600;font-size:14px;padding:6px 12px;border-radius:3px;background:var(--panel2);border:2px solid var(--line);color:var(--cyan);letter-spacing:1px}
  .tool{border:2px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:3px;
    font-weight:600;font-size:15px;cursor:pointer;transition:.15s}
  .tool:hover{border-color:var(--cyan);color:var(--cyan)}
  .tool:active{transform:translateY(2px)}
  .tool.on{background:var(--pink);border-color:var(--pink);color:#2a0618}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .stat{min-width:104px;padding:9px 12px;border-radius:3px;background:#02060d;border:2px solid var(--line);
    font-family:var(--pix);font-size:17px;line-height:1;color:var(--cyan);text-align:center;letter-spacing:1px;text-shadow:-2px 0 var(--pink),2px 0 var(--cyan);color:#eafcff;animation:statglitch 6s infinite}
  .hud .stat:last-child{animation-delay:-3s}
  @keyframes statglitch{0%,92%,100%{transform:none}94%{transform:translateX(3px);text-shadow:-5px 0 var(--pink),5px 0 var(--cyan)}96%{transform:translateX(-3px);text-shadow:4px 0 var(--pink),-4px 0 var(--cyan)}98%{transform:translateX(1px)}}
  .stat span{font-family:var(--ui);font-size:16px;margin-right:6px}
  #face{width:54px;height:54px;border-radius:3px;font-size:28px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;transition:.15s}
  #face:hover{border-color:var(--cyan);animation:jitter .25s steps(2) infinite}
  @keyframes jitter{50%{transform:translate(2px,-1px);filter:drop-shadow(-2px 0 #ff5c93) drop-shadow(2px 0 #4fd8e8)}}
  #face:active{transform:translateY(2px)}
  .boardwrap{overflow:auto;max-width:calc(100vw - 80px);max-height:62vh;padding:8px;border-radius:3px;background:#030812;border:2px solid var(--line)}
  #board{display:grid;gap:3px;width:max-content;margin:0 auto;position:relative}
  .cell{
    width:var(--cell);height:var(--cell);border-radius:2px;display:flex;align-items:center;justify-content:center;
    font-family:var(--pix);font-weight:400;font-size:calc(var(--cell)*.4);cursor:pointer;position:relative;color:#fff;
    background:#17446f;box-shadow:inset 3px 3px 0 #3a7db5,inset -3px -3px 0 #0b2a47;
    transition:transform .1s,filter .1s;
  }
  .cell.long{font-size:calc(var(--cell)*.3)}
  .cell.spawn{animation:spawn .4s both steps(5)}
  @keyframes spawn{from{opacity:0;transform:scale(.4)}}
  .cell:not(.open):hover{filter:brightness(1.3)}
  .cell:not(.open):active{transform:scale(.92)}
  .cell.open{background:#060f1f;box-shadow:inset 0 0 0 1px #12304f;cursor:default;animation:reveal .3s both}
  @keyframes reveal{0%{transform:scale(.7);background:#4fd8e8}100%{transform:none}}
  .n0{color:#7d8fc2}
  .n1{color:#5bc0ff}.n2{color:#53e69a}.n3{color:#ff6b7a}.n4{color:#c58bff}
  .n5{color:#ffb454}.n6{color:#4fe3e3}.n7{color:#ff7ac8}.n8{color:#e6f0f7}
  .cell.open[class*=" n"]{text-shadow:none}
  /* números legíveis: a fonte pixel só fica nítida em múltiplos de 8px; sem o brilho colorido que embaralhava o 5 com o 8 */
  .cell{font-size:round(nearest,calc(var(--cell)*.46),8px);letter-spacing:0;-webkit-font-smoothing:none;font-smooth:never}
  .cell.long{font-size:round(nearest,calc(var(--cell)*.3),8px)}
  .cell.open.neg{background:#0a2145;box-shadow:inset 0 0 0 2px #2d6fd0}
  /* a pilha de bandeiras/bombas ocupa SEMPRE o mesmo quadrado, centralizado: 1 grande; 2 ou 3 juntas cabem no mesmo espaço */
  #board{--fb:calc(var(--cell)*.74)}
  #board.shapes{--fb:calc(var(--cell)*.6)}
  #board.tri{--fb:calc(var(--cell)*.46)}
  .demo{--fb:calc(var(--cell)*.74)}
  .stack{position:relative;width:var(--fb);height:var(--fb);pointer-events:none;flex:none}
  .stack>span{position:absolute;display:block;font-size:calc(var(--cell)*.4)}
  .stack>span .px{width:100%;height:100%;display:block;vertical-align:top}
  .stack.s1>span{left:0;top:0;width:100%;height:100%}
  .stack.s2>span:nth-child(1){left:0;top:0;width:64%;height:64%}
  .stack.s2>span:nth-child(2){right:0;bottom:0;width:64%;height:64%}
  .stack.s3>span:nth-child(1){left:22%;top:0;width:56%;height:56%}
  .stack.s3>span:nth-child(2){left:0;bottom:0;width:56%;height:56%}
  .stack.s3>span:nth-child(3){right:0;bottom:0;width:56%;height:56%}
  .flag{display:inline-block}
  .flaglayer{position:absolute;inset:3px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .flaglayer.cover{background:inherit}
  .flaglayer.ftop{z-index:2}
  .flaglayer.up{animation:asmUp .24s steps(8) both}
  .flaglayer.dn{animation:asmDn .24s steps(8) both}
  @keyframes asmUp{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes asmDn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
  .flag.neg{filter:hue-rotate(180deg) saturate(1.3) drop-shadow(0 0 4px #4fa8ff)}
  @keyframes flagpop{from{transform:scale(0) translateY(-14px)}}
  .badge{position:absolute;right:1px;bottom:0;font-family:var(--pix);font-size:calc(var(--cell)*.26);line-height:1;font-style:normal;
    background:#000c;color:#fff;border-radius:2px;padding:2px 3px;animation:flagpop .3s}
  .badge.neg{color:#8ec5ff}
  .cell.flagged{background:#7a2a4f;box-shadow:inset 3px 3px 0 #b8487e,inset -3px -3px 0 #451430}
  .cell.negflag{background:#1f4e9c;box-shadow:inset 3px 3px 0 #3d7fe0,inset -3px -3px 0 #102a58}
  .cell.mine{background:#2a0f1d;box-shadow:inset 0 0 0 1px #5a1d36}
  /* bomba armada: aparece, treme e pisca vermelho/preto antes de explodir */
  .cell.fuse{z-index:8;animation:fuseShake .09s steps(2) infinite,fuseBlink .34s steps(1) infinite}
  .cell.fuse2{animation:fuseShake .05s steps(2) infinite,fuseBlink .16s steps(1) infinite}
  .cell.fuse .stack{animation:bombPop .28s cubic-bezier(.2,1.8,.4,1),bombThrob .16s steps(2) .28s infinite}
  @keyframes bombThrob{50%{transform:scale(1.25)}}
  .cell.fuse .stack img{filter:drop-shadow(1px 0 #fff) drop-shadow(-1px 0 #fff) drop-shadow(0 1px #fff) drop-shadow(0 -1px #fff)}
  @keyframes fuseShake{0%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}100%{transform:translate(-1px,-1px)}}
  @keyframes fuseBlink{0%{background:#ff1f3a;box-shadow:0 0 18px #ff1f3a}50%{background:#050505;box-shadow:0 0 18px #ff1f3a}}
  @keyframes bombPop{from{transform:scale(0) rotate(-40deg)}}
  .cell.negmine{background:#0a2145;box-shadow:inset 0 0 0 1px #2d6fd0}
  .cell.negmine .stack>span{filter:invert(1) drop-shadow(0 0 4px #4fa8ff)}
  .cell.boom{background:var(--red)!important;z-index:2;animation:boom .45s both}
  @keyframes boom{0%{transform:scale(.5)}50%{transform:scale(1.35)}100%{transform:none}}
  .cell.wrong{background:#4b1d2a}
  .cell.wrong::after{content:"✖";position:absolute;color:var(--red);font-size:16px;right:2px;top:-2px}
  #board.shapes{display:block;position:relative;background:#02060d;border-radius:3px}
  #board.shapes .cell{position:absolute;border-radius:0;box-shadow:none}
  #board.shapes .cell:not(.open):hover{z-index:3}
  #board.shapes .cell.open{background:#081426}
  #board.shapes .cell.open.neg{background:#0a2145}
  #board.shapes .cell.negmine{background:#0a2145}
  #board.shapes .cell.mine:not(.negmine){background:#2a0f1d}
  #board.shapes .cell.flagged{background:#7a2a4f}
  #board.shapes .cell.negflag{background:#1f4e9c}
  #board.shapes .cell.boom{z-index:4}
  #board.shapes .badge{right:auto;bottom:auto;left:calc(50% + var(--cell)*.1);top:calc(50% + var(--cell)*.08)}
  #board.shapes .cell.wrong::after{right:auto;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px}
  #board.shake{animation:shake .5s,rgbsplit .6s}
  @keyframes rgbsplit{0%,100%{filter:none}20%{filter:drop-shadow(-6px 0 #ff5c93) drop-shadow(6px 0 #4fd8e8)}50%{filter:drop-shadow(5px 0 #ff5c93) drop-shadow(-5px 0 #4fd8e8) hue-rotate(40deg)}80%{filter:drop-shadow(-3px 0 #ff5c93) drop-shadow(3px 0 #4fd8e8)}}
  @keyframes shake{20%{transform:translate(-8px,3px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
  #board.win{animation:rgbsplit 1.2s 2}
  #board.win .cell{animation:wave .8s both}
  @keyframes wave{50%{transform:translateY(-10px) scale(1.12);filter:brightness(1.6)}}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;font-size:14px;color:var(--muted)}
  .best{font-weight:600;color:var(--cyan)}
  #help{justify-content:center;text-align:center;line-height:1.45;font-size:13px}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#02060dcc;
    z-index:5;opacity:0;pointer-events:none;transition:.3s}
  #overlay.show{opacity:1;pointer-events:auto}
  .modal{background:var(--panel);border:2px solid var(--cyan);border-radius:3px;padding:28px 38px;text-align:center;box-shadow:0 0 40px #4fd8e833;
    transform:scale(.7);transition:.35s steps(6);max-width:92vw}
  #overlay.show .modal{transform:none}
  .modal .big{font-size:56px;animation:bounce 1s infinite steps(2)}

  };

function noise(dur,vol,f0,f1,delay=0){

  f0*=SP.noiseF;f1*=SP.noiseF;vol*=SP.noiseV;
  const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);

  const f=a.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);

  src.connect(f);f.connect(g);g.connect(a.destination);src.start(t);
}

function paintToken(e,tok){
  const suf=tok.match(/((?:[*^>]|:a|:b)*)$/)[1];tok=tok.slice(0,tok.length-suf.length);
  const cls=['cell'];let html='';
  if(tok===''||tok==='.'){}
  else if(tok==='_')cls.push('open');
  else if(/^-?\d+$/.test(tok)){const v=+tok;cls.push('open','n'+(v===0?0:((Math.abs(v)-1)%8)+1));if(v<0)cls.push('neg');html=tok}
  else if(/^g\d+$/.test(tok)){cls.push('ghost');html=tok.slice(1)}
  else if(/^F+$/.test(tok)){cls.push('flagged');html=stackHTML('🚩',tok.length,' flag')}
  else if(/^N+$/.test(tok)){cls.push('negflag');html=stackHTML('🚩',tok.length,' flag neg')}
  else if(/^B+$/.test(tok)){cls.push('open','mine');html=stackHTML('💣',tok.length,'')}
  else if(/^X+$/.test(tok)){cls.push('open','mine','negmine');html=stackHTML('💣',tok.length,'')}
  else if(tok[0]==='~'){const t=tok.slice(1);html=t;cls.push('open','hint',t[0]==='Σ'?'n6':t[0]==='≥'?'hge':t[0]==='≤'?'hle':'hp');if(t.length>=3)cls.push('long')}
  if(suf.includes('*'))cls.push('hl');
  if(suf.includes(':a'))cls.push('op0');if(suf.includes(':b'))cls.push('op1');
  if(suf.includes('^'))html+='<i class="scanring"></i>';
  if(suf.includes('>'))html+='<i class="ptr">👆</i>';
  const cn=cls.join(' ');if(e.className!==cn)e.className=cn;
  if(e._h!==html){e.innerHTML=html;e._h=html}
}

function floorGeom(kind){
  if(kind==='irr')return voronoi(6,5,32);
  if(kind==='tri')return triangles(6,5,32);
  const cols=6,rows=5,s=32,g=3,polys=[],adjL=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    polys.push([{x:c*s+g/2,y:r*s+g/2},{x:(c+1)*s-g/2,y:r*s+g/2},{x:(c+1)*s-g/2,y:(r+1)*s-g/2},{x:c*s+g/2,y:(r+1)*s-g/2}]);
    const a=[];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;let x=c+dx,y=r+dy;
      if(kind==='torus'){x=(x+cols)%cols;y=(y+rows)%rows}else if(x<0||y<0||x>=cols||y>=rows)continue;
      a.push(y*cols+x);
    }
    adjL.push(a);
  }
  return{polys,adj:adjL,W:cols*s,H:rows*s};
}
function runFloorDemo(box,kind){
  const G=floorGeom(kind),cols=6,rows=5;

  svg.innerHTML=`<svg viewBox="0 0 ${G.W} ${G.H}" class="dsvg">`+
    G.polys.map(p=>`<polygon points="${p.map(v=>v.x.toFixed(1)+','+v.y.toFixed(1)).join(' ')}"/>`).join('')+'</svg>';
  const cap=document.createElement('div');cap.className='dcap';box.append(svg,cap);
  const polys=[...svg.querySelectorAll('polygon')];
  let focus;
  if(kind==='square')focus=[2*cols+3];
  else if(kind==='torus')focus=[0,cols*rows-1,cols-1,(rows-1)*cols];
  else{ // casas mais próximas do centro, com o maior número de vizinhas
    const cx=G.W/2,cy=G.H/2;
    focus=G.polys.map((p,i)=>({i,d:Math.hypot(p.reduce((s,v)=>s+v.x,0)/p.length-cx,p.reduce((s,v)=>s+v.y,0)/p.length-cy)}))
      .sort((a,b)=>a.d-b.d).slice(0,5).map(o=>o.i);

  let f=0;

    polys.forEach(p=>p.removeAttribute('class'));

    G.adj[i].forEach(j=>polys[j].setAttribute('class','nb'));

/* piso irregular: diagrama de Voronoi com pontos sorteados */
function clip(poly,nx,ny,c,tag){
  const out=[],n=poly.length;
  for(let i=0;i<n;i++){
    const A=poly[i],B=poly[(i+1)%n],da=nx*A.x+ny*A.y-c,db=nx*B.x+ny*B.y-c;
    const I=()=>{const k=da/(da-db);return{x:A.x+(B.x-A.x)*k,y:A.y+(B.y-A.y)*k}};
    if(da<=0){out.push({x:A.x,y:A.y,t:A.t});if(db>0){const p=I();out.push({x:p.x,y:p.y,t:tag})}}
    else if(db<=0){const p=I();out.push({x:p.x,y:p.y,t:A.t})}
  }
  return out;
}
function voronoi(gc,gr,s){
  const W=gc*s,H=gr*s,g=Math.max(3,s*.09),raw=[];
  for(let j=0;j<gr;j++)for(let i=0;i<gc;i++)raw.push([(i+.5+(Math.random()-.5)*.84)*s,(j+.5+(Math.random()-.5)*.84)*s]);
  const sets=raw.map(()=>new Set()),polys=[];
  raw.forEach((p,k)=>{
    const ci=k%gc,cj=k/gc|0;
    let poly=[[g/2,g/2],[W-g/2,g/2],[W-g/2,H-g/2],[g/2,H-g/2]].map(([x,y])=>({x,y,t:-1}));
    for(let dj=-2;dj<=2;dj++)for(let di=-2;di<=2;di++){
      const i=ci+di,j=cj+dj;if((!di&&!dj)||i<0||j<0||i>=gc||j>=gr)continue;
      const m=j*gc+i,q=raw[m],dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),nx=dx/len,ny=dy/len;
      poly=clip(poly,nx,ny,nx*(p[0]+q[0])/2+ny*(p[1]+q[1])/2-g/2,m);
    }
    polys.push(poly);
    poly.forEach((v,i)=>{const w=poly[(i+1)%poly.length];
      if(v.t>=0&&Math.hypot(w.x-v.x,w.y-v.y)>2){sets[k].add(v.t);sets[v.t].add(k)}});
  });
  return{polys,adj:sets.map(a=>[...a]),W,H};
}
/* piso triangular: triângulos equiláteros; vizinhos = quem divide ao menos um vértice (12) */
function triangles(gc,gr,s){
  const a=s*1.52,half=a/2,h=a*.866,g=Math.max(3,s*.09);
  const tc=Math.max(4,Math.floor(2*gc*s/a)-1),rows=Math.max(3,Math.floor(gr*s/h));
  const ri=a/(2*Math.sqrt(3)),f=(ri-g/2)/ri;
  const polys=[],vmap=new Map();
  for(let r=0;r<rows;r++)for(let c=0;c<tc;c++){
    const up=(r+c)%2===0,v=up?[[c,r+1],[c+2,r+1],[c+1,r]]:[[c,r],[c+2,r],[c+1,r+1]],k=polys.length;
    v.forEach(([i,j])=>{const key=i+','+j;if(!vmap.has(key))vmap.set(key,[]);vmap.get(key).push(k)});
    const p=v.map(([i,j])=>({x:i*half,y:j*h})),cx=(p[0].x+p[1].x+p[2].x)/3,cy=(p[0].y+p[1].y+p[2].y)/3;
    polys.push(p.map(q=>({x:cx+(q.x-cx)*f,y:cy+(q.y-cy)*f})));
  }
  const sets=polys.map(()=>new Set());
  vmap.forEach(l=>l.forEach(a=>l.forEach(b=>{if(a!==b)sets[a].add(b)})));
  return{polys,adj:sets.map(x=>[...x]),W:(tc+1)*half,H:rows*h};
}
function mountPolys(G,s){
  adj=G.adj;pts=[];grid=[[]];
  G.polys.forEach((poly,k)=>{
    let A=0,cx=0,cy=0;
    poly.forEach((a,i)=>{const b=poly[(i+1)%poly.length],f=a.x*b.y-b.x*a.y;A+=f;cx+=(a.x+b.x)*f;cy+=(a.y+b.y)*f});
    A/=2;cx/=6*A;cy/=6*A;
    const hw=Math.max(...poly.map(v=>Math.abs(v.x-cx)))+1,hh=Math.max(...poly.map(v=>Math.abs(v.y-cy)))+1;
    const el=document.createElement('div');el.className='cell spawn';
    el.style.cssText=`left:${cx-hw}px;top:${cy-hh}px;width:${2*hw}px;height:${2*hh}px;clip-path:polygon(${
      poly.map(v=>`${(v.x-cx+hw).toFixed(1)}px ${(v.y-cy+hh).toFixed(1)}px`).join(',')})`;
    pts.push([cx/s,cy/s]);
    el.style.animationDelay=((cx+cy)/s*18)+'ms';
    el.addEventListener('animationend',()=>el.classList.remove('spawn'),{once:true});
    grid[0].push({m:0,o:false,f:0,n:0,a:0});
    setupCell(el,k,0);boardEl.appendChild(el);cells.push(el);
  });

}

function neighbors(x,y){
  if(shapes)return adj[x].map(j=>[j,0]);
  const a=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;let nx=x+dx,ny=y+dy;
    if(floor==='torus'){nx=(nx+C)%C;ny=(ny+R)%R}
    else if(nx<0||ny<0||nx>=C||ny>=R)continue;
    a.push([nx,ny]);
  }

}

function placeLayout(m){

  for(let i=0;i<C*R;i++){ // número = soma das minas na "área do número" (vizinhos; no Eco, 5×5)

/* números mentirosos e dicas parciais (valores mostrados ≠ valores reais) */
function prepareDisplay(){

    cand.slice(0,LIARS[level]).forEach(g=>{

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function makeLayout(s){
  const N=C*R;let safe=new Set([s,...NA[s]]);if(N-safe.size<plan.length)safe=new Set([s]); // tabuleiros minúsculos: só a casa clicada é garantida
  const m=new Int8Array(N);
  if(has('mirror')){ // minas em pares gêmeos (posições opostas)
    const cand=mpairs.filter(([i,j])=>!safe.has(i)&&!safe.has(j));shuffle(cand);
    for(let k=0;k<plan.length/2&&k<cand.length;k++){m[cand[k][0]]=plan[2*k];m[cand[k][1]]=plan[2*k+1]}
    return m;
  }
  const free=[];
  for(let i=0;i<N;i++)if(!safe.has(i))free.push(i);
  shuffle(free);
  plan.forEach((v,i)=>{m[free[i]]=v});
  return m;
}
/* Resolve por lógica pura (propagação de intervalos + subtração de restrições), sem chutar.
   Devolve a fração das casas seguras que um jogador consegue abrir sozinho a partir do 1º clique. */
function analyze(mv,start){
  const N=mv.length,dmin=has('negative')?(has('multi')?-3:-1):0,dmax=has('multi')?3:1;
  const n=new Int16Array(N),a=new Uint8Array(N);
  for(let i=0;i<N;i++)for(const j of NA[i]){n[i]+=mv[j];if(mv[j]!==0)a[i]++}
  const lo=new Int8Array(N).fill(dmin),hi=new Int8Array(N).fill(dmax),opened=new Uint8Array(N),pend=new Uint8Array(N);
  let safeTotal=0;for(let i=0;i<N;i++)if(mv[i]===0)safeTotal++;
  const cons=[],varCons=Array.from({length:N},()=>[]),queue=[],toOpen=[],seen=new Set(),mi=has('mirror')?mirrorOf:null;
  let cnt=0,bad=false;
  const enq=k=>{const c=cons[k];if(!c.q){c.q=true;queue.push(k)}};
  const addCons=(vars,T)=>{const k=cons.length;cons.push({v:vars,T,q:false});for(const j of vars)varCons[j].push(k);enq(k)};
  function open(i){
    const st=[i];
    while(st.length){
      const c=st.pop();if(opened[c])continue;
      if(mv[c]!==0){bad=true;continue}
      opened[c]=1;lo[c]=hi[c]=0;cnt++;
      if(mi&&mi[c]!==c&&!opened[mi[c]])st.push(mi[c]); // a gêmea de uma casa segura também é segura
      if(a[c]===0){for(const j of nbr[c])if(!opened[j])st.push(j)}
      else addCons(NA[c].filter(j=>!opened[j]),n[c]);
      for(const k of varCons[c])enq(k);
    }
  }
  function touch(j){ // domínio de j mudou: sincroniza com a gêmea (Espelho), enfileira restrições e detecta casas seguras
    const list=[j];
    if(mi&&mi[j]!==j){const t=mi[j],nl=Math.max(lo[t],lo[j]),nh=Math.min(hi[t],hi[j]);lo[t]=lo[j]=nl;hi[t]=hi[j]=nh;list.push(t)}
    for(const x of list){
      if(lo[x]===0&&hi[x]===0&&!opened[x]&&!pend[x]){pend[x]=1;toOpen.push(x)}
      for(const q of varCons[x])enq(q);
    }
  }
  function propagate(){
    while(queue.length){
      const k=queue.pop(),c=cons[k];c.q=false;
      for(let guard=0;guard<40;guard++){
        let sl=0,sh=0;for(const j of c.v){sl+=lo[j];sh+=hi[j]}
        if(c.T<sl||c.T>sh)break;
        let ch=false;
        for(const j of c.v){
          const nl=Math.max(lo[j],c.T-(sh-hi[j])),nh=Math.min(hi[j],c.T-(sl-lo[j]));
          if(nl!==lo[j]||nh!==hi[j]){
            lo[j]=nl;hi[j]=nh;ch=true;touch(j);
          }
        }
        if(!ch)break;
      }
    }
  }
  function derive(){ // se A ⊂ B, então (B − A) tem soma T_B − T_A
    const norm=[],byVar=new Map();
    for(const c of cons){
      const u=[];let T=c.T;
      for(const j of c.v){if(lo[j]===hi[j])T-=lo[j];else u.push(j)}
      if(!u.length)continue;
      const o={u,T,set:new Set(u)},id=norm.length;norm.push(o);
      for(const j of u){let l=byVar.get(j);if(!l)byVar.set(j,l=[]);l.push(id)}
    }
    let added=0;
    for(const A of norm){
      if(A.u.length>12||cons.length>9000)continue;
      for(const id of byVar.get(A.u[0])){
        const B=norm[id];if(B===A||B.u.length<=A.u.length)continue;
        let sub=true;for(const j of A.u)if(!B.set.has(j)){sub=false;break}
        if(!sub)continue;
        const d=B.u.filter(j=>!A.set.has(j)),key=d.join(',')+':'+(B.T-A.T);
        if(seen.has(key))continue;seen.add(key);addCons(d,B.T-A.T);added++;
      }
    }
    return added>0;
  }
  open(start);const flood=cnt;
  for(let rounds=0;rounds<60&&!bad;rounds++){
    propagate();
    if(toOpen.length){while(toOpen.length)open(toOpen.pop());continue}
    if(!derive())break;
  }
  return{frac:bad?0:cnt/safeTotal,extra:cnt-flood,bad};
}

/* sorteia vários tabuleiros e fica com um que dá para resolver por lógica depois do 1º clique */
async function startBoard(sx,sy){
  const id=genId,s=sy*C+sx,cell=cells[s];
  const thr={easy:1,medium:1,hard:.92,insane:.8}[level],budget={easy:1500,medium:2400,hard:3200,insane:3800}[level];
  zoomIn(cell);
  const t0=performance.now();let best=null;
  for(;;){
    const m=makeLayout(s),r=analyze(m,s);
    if(!best||r.frac>best.r.frac)best={m,r};
    const el=performance.now()-t0;
    if(best.r.frac>=thr||(el>budget&&best.r.extra>0)||el>budget*2)break;
    await tick();if(id!==genId)return false;
  }
  const wait=1300-(performance.now()-t0);if(wait>0)await sleep(wait);
  if(id!==genId){resetZoom();return false}
  placeLayout(best.m);slam(cell);return true;
}

function chain(x,y,id){
  const loser=turn,mines=[],g0=$('#game');
  for(let j=0;j<R;j++)for(let i=0;i<C;i++){const g=grid[j][i];
    if(g.m!==0&&g.f!==g.m)mines.push([i,j]);
    else if(g.m===0&&g.f!==0)el(i,j).classList.add('wrong');}
  mines.sort((a,b)=>dist(a,[x,y])-dist(b,[x,y]));
  // mede as posições UMA vez (evita recalcular layout a cada explosão, que travava)
  const pos0=mines.map(([i,j])=>{const r=el(i,j).getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2,r.width]});
  // tempo entre explosões diminui (cadeia acelerando), total limitado a ~2 s
  const gaps=mines.map((_,k)=>k===0?0:Math.max(10,130*Math.pow(.9,k)));
  const sum=gaps.reduce((a,b)=>a+b,0),sc=Math.min(1,2000/Math.max(sum,1));
  let tm=0;const times=gaps.map(g=>(tm+=g*sc));
  const per=Math.max(3,Math.min(24,Math.round(600/Math.max(1,mines.length))));
  g0.classList.add('quake');
  mines.forEach(([i,j],k)=>setTimeout(()=>{
    if(id!==genId)return;
    const e=el(i,j),m=grid[j][i].m,first=(i===x&&j===y);
    e.classList.remove('flagged','negflag');e.classList.add('open','mine');
    if(m<0)e.classList.add('negmine');
    if(!first)e.innerHTML=mineHTML(m);
    if(k<30)neighbors(i,j).forEach(([a,b])=>{const n=el(a,b);if(!n.classList.contains('mine')&&!n.classList.contains('blast'))n.classList.add('blast')});
    if(first){e.classList.add('boom');boardEl.classList.add('shake2');SFX.boom()}
    const [px,py,pw]=pos0[k];
    blastAt(px,py,pw,first?60:per,m<0,first||k%8===0);
    if(!first&&k%3===0)kick(.45);
    const now=performance.now();if(!first&&now-lastBoomT>60){lastBoomT=now;SFX.chain(k)}
  },times[k]||0));
  const end=(times[times.length-1]||0)+250;
  setTimeout(()=>{ // clímax: clarão branco, tremor forte e a última explosão
    if(id!==genId)return;
    const f=document.createElement('div');f.className='flashfull';document.body.appendChild(f);setTimeout(()=>f.remove(),700);
    kick(2.2);SFX.slam();boardEl.classList.remove('shake2');void boardEl.offsetWidth;boardEl.classList.add('shake2');
  },end);
  setTimeout(()=>{if(id===genId)g0.classList.remove('quake')},end+500);
  revealLiars();
  setTimeout(()=>{
    if(id!==genId)return;
    if(campaign){campAfterLose();return}
    if(has('duel'))modal('💥',tr('duelBoom',PN[loser]),tr('duelBoomText',PN[1-loser],scores[0],scores[1]));
    else modal('💥',tr('boom'),tr('boomText'));
  },end+900);
}

    for(const [a,b] of neighbors(cx,cy)){const k=b*C+a;if(!seen.has(k)){seen.set(k,d+1);q.push([a,b])}}}

    const e=cells[k];e.style.setProperty('--sd',(d*130)+'ms');e.classList.add('scan');setTimeout(()=>e.classList.remove('scan'),1300)});

function loadCamp(){
  camp=newCamp();
  try{const j=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');
    if(j&&typeof j==='object'){
      if(!j.ws){const m=wsNew();WKEYS.forEach(k=>{if(j[k]!==undefined)m[k]=j[k]});m.drones=j.drones;m.bot=j.bot;j.ws={mine:m}} // save antigo: o progresso vira o do Classic
      if(!j.miners){ // migração: drones por mundo viram globais; robôs por mundo viram mineradores individuais
        const dr=[0,0,0],mn=[];let seq=0;
        Object.entries(j.ws).forEach(([id,w])=>{(w.drones||[]).forEach((n,i)=>{dr[i]+=n||0});if(w.bot&&w.bot.own)mn.push({id:++seq,world:id,spd:w.bot.spd||0,pow:w.bot.eff||0,int:Math.min(3,w.bot.rch||0)})});
        j.drones=dr;j.droneT=[0,0,0];j.miners=mn;j.minerSeq=seq;
      }
      camp={...camp,...j};
    }}catch(e){}
  WKEYS.forEach(k=>delete camp[k]);
  if(!camp.cleared)camp.cleared={};
  Object.values(camp.ws).forEach(w=>{delete w.drones;delete w.droneT;delete w.bot});
  if(camp.tabs)camp.tabs=camp.tabs.map(t=>t==='drones'?'bots':t);if(camp.newTab&&camp.newTab.drones){camp.newTab.bots=true;delete camp.newTab.drones}
  if(!camp.newTab)camp.newTab={};
  if(camp.tabs)camp.tabs=camp.tabs.filter(t=>t!=='loadout'&&t!=='floors');
  if(!camp.worlds)camp.worlds={mine:true};if(!camp.world||!camp.ws[camp.world]&&!WORLDS.some(w=>w.id===camp.world))camp.world='mine';if(!camp.wvis)camp.wvis={};
  WORLDS.forEach(w=>{camp.ws[w.id]={...wsNew(),...(camp.ws[w.id]||{})}});
  WORLDS.forEach(w=>{const nx=NEXT[w.id];if(nx&&camp.worlds[nx])camp.cleared[w.id]=true});
  if(camp.jv!==2){ // migração: contador por mundo → contador único do trajeto
    const fr=WORLDS.find(w=>camp.worlds[w.id]&&!camp.cleared[w.id]),f=fr?fr.id:'desert',st=BOSS_AT[PREV[f]]||0;
    camp.boards=fr?st+Math.min(camp.ws[f].boards||0,BOSS_AT[f]-st):BOSS_AT.desert;camp.jv=2;
    WORLDS.forEach(w=>{if(camp.cleared[w.id])camp.ws[w.id].ib=camp.ws[w.id].boards||0});
  }
  Object.values(camp.ws).forEach(w=>{delete w.boards});
  WORLDS.forEach(w=>{camp.ws[w.id].size=sizeIdx(w.id,camp.boards+1)});
  {const own=WORLDS.filter(w=>camp.worlds[w.id]).map(w=>w.id);own.forEach(w=>{camp.miners.filter(m=>m.world===w).slice(PER_WORLD).forEach(m=>{const t=own.find(x=>camp.miners.filter(q=>q.world===x).length<PER_WORLD);if(t)m.world=t})})}

  if(camp.msc!==5){ // bots antigos (fortes) viram 5 bots novos cada, com os mesmos upgrades: a produção total é a mesma
    const old=camp.miners.slice();old.forEach(m=>{for(let k=0;k<4;k++)camp.miners.push({...m,id:++camp.minerSeq,acc:0,bacc:0})});camp.msc=5} // Power novo: quem já tinha Speed mantém a velocidade de mineração

/* ---------- Smily lembra do que você fez (memória) e quebra a quarta parede ---------- */
function memLine(ctx){
  const sz=SIZES[camp.size],said=camp.mem||(camp.mem={});const c=[];
  const once=(k,t,m)=>{if(!said[k])c.push({k,t,m,once:1})};
  if(ctx==='lose'){
    if((camp.lstreak||0)>=3)c.push({t:X(`That's ${camp.lstreak} losses in a row on the ${sz}×${sz}. Want me to lower the difficulty? Kidding. I don't do that.`,`São ${camp.lstreak} derrotas seguidas no ${sz}×${sz}. Quer que eu baixe a dificuldade? Brincadeira. Eu não faço isso.`),m:'😈'});
    if(camp.losses===1)once('firstLoss',X("Your first loss. It's like your first haircut: it'll happen again, and it'll hurt.","Sua primeira derrota. É que nem o primeiro corte de cabelo: vai acontecer de novo, e vai doer."),'😈');
    if(camp.shields>=3)c.push({t:X(`You're hoarding ${camp.shields} shields like a dragon, and still stepped on a mine. Impressive.`,`Você junta ${camp.shields} escudos feito dragão e mesmo assim pisou na mina. Impressionante.`),m:'😏'});
    if(camp.bossLost)c.push({t:X(`${camp.bossLost} boss${camp.bossLost>1?'es':''} took everything from you. I'm not saying I'm proud. I'm saying I'm proud.`,`${camp.bossLost} chefe${camp.bossLost>1?'s':''} levou${camp.bossLost>1?'ram':''} tudo de você. Não estou dizendo que tenho orgulho. Estou dizendo que tenho orgulho.`),m:'😈'});
  }else{
    if(camp.streak>=5)c.push({t:X(`${camp.streak} wins in a row. Are you cheating? Asking for me. Mostly for me.`,`${camp.streak} vitórias seguidas. Está trapaceando? Pergunto por mim. Principalmente por mim.`),m:'🤨'});
    [10,25,50,100].forEach(n=>{if(camp.wins===n)once('w'+n,X(`Win number ${n}. I'm not counting. I'm absolutely counting.`,`Vitória número ${n}. Não estou contando. Estou contando sim.`),'😒')});
    if(camp.coins>=4000&&camp.coins>COST.cpc()*20)c.push({t:X(`You're sitting on ${fmtC(camp.coins)} coins. Spend them or I'll start charging rent.`,`Você está com ${fmtC(camp.coins)} moedas paradas. Gaste, ou eu começo a cobrar aluguel.`),m:'😏'});
    if(camp.shields===0&&camp.wins>8)once('noShield',X("No shields at all? Bold. Or foolish. I'll know in about three boards.","Sem nenhum escudo? Ousado. Ou tolo. Eu descubro em umas três fases."),'😏');
    if(camp.bossWon)c.push({t:X(`You beat ${camp.bossWon} boss${camp.bossWon>1?'es':''}. I'm still angry about it.`,`Você venceu ${camp.bossWon} chefe${camp.bossWon>1?'s':''}. Ainda estou bravo com isso.`),m:'😠'});
    if(camp.losses===0&&camp.wins>=5)once('perfect',X("Zero losses so far. Enjoy it. Statistics are on my side.","Zero derrotas até agora. Aproveite. A estatística está do meu lado."),'🙄');
  }
  if(!c.length)return null;const k=c[Math.random()*c.length|0];if(k.once){said[k.k]=1;saveCamp()}return {t:RES(k.t),mood:k.m};
}
function quipOr(ctx,vars){

}
function sayOne(en,pt,mood){if(!campaign||tutorial||!camp||bossOn&&!over)return;sayText(RES(X(en,pt)),mood||'🤨',false)}
(function fourthWall(){
  let hiddenAt=0,clicks=[],lastFW=0;const ok=()=>Date.now()-lastFW>25000;const mark=()=>{lastFW=Date.now()};
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){hiddenAt=Date.now();return}
    const away=(Date.now()-hiddenAt)/1000;if(!hiddenAt||!campaign||tutorial)return;hiddenAt=0;
    if(away>300){mark();setTimeout(()=>sayOne("Oh, you're back. It's been ages. I rebuilt the whole board twice out of boredom.","Ah, você voltou. Faz séculos. Reconstruí o tabuleiro duas vezes de tédio.",'😒'),500)}
    else if(away>20){mark();setTimeout(()=>sayOne("Oh, you switched tabs. I saw. I always see. What was in the other tab? Be honest.","Ah, você trocou de aba. Eu vi. Eu sempre vejo. O que tinha na outra aba? Seja sincero.",'🤨'),500)}
  });
  addEventListener('pointerdown',e=>{
    if(!campaign||tutorial||!e.target.closest||!e.target.closest('.cell'))return;
    const n=Date.now();clicks=clicks.filter(t=>n-t<2000);clicks.push(n);
    if(clicks.length>=9&&ok()){clicks=[];mark();sayOne("Easy! You're clicking like the board owes you money.","Calma! Você clica como se o tabuleiro te devesse dinheiro.",'😬')}
  },true);
  let hourDone=false;
  setInterval(()=>{if(hourDone||!campaign||tutorial||!camp||!ok()||Date.now()-lastQuip<8000)return;
    const h=new Date().getHours();
    if(h>=0&&h<5){hourDone=true;mark();sayOne(`It's ${h}:${String(new Date().getMinutes()).padStart(2,'0')} in the morning. Go to sleep. The mines will still be here. Sadly.`,`São ${h}:${String(new Date().getMinutes()).padStart(2,'0')} da manhã. Vai dormir. As minas vão estar aqui. Infelizmente.`,'😴')}
    else if(h>=5&&h<7){hourDone=true;mark();sayOne("Playing before 7 AM? Either dedication or a long night. I won't ask.","Jogando antes das 7 da manhã? Ou é dedicação ou foi uma noite longa. Não vou perguntar.",'🤨')}
  },20000);
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#sound'))setTimeout(()=>{if(muted&&ok()){mark();sayOne("You muted me. Rude. I'm still talking though. Just louder, in my head.","Você me silenciou. Grosseiro. Continuo falando. Só que mais alto, na minha cabeça.",'😠')}},60)});
})();
function quip(ctx,vars){
  const arr=LINES[ctx];if(!arr||!campaign||tutorial)return;
  let t=RES(arr[Math.random()*arr.length|0]);
  if(vars)for(const k in vars)t=t.replace('{'+k+'}',vars[k]);
  sayText(t,MOODS[ctx],false);
}

/* ---------- economia ---------- */
const cpcVal=()=>1+camp.cpc;
const clearMult=()=>1+camp.clear*.25;
// a espera é POR QUADRADO: mais quadrados no tabuleiro, mais demora. O upgrade Recarga reduz o tempo por quadrado.
const coolPer=(l=camp.cool)=>.4*Math.pow(.86,l);
const coolSecs=()=>{const n=SIZES[sizeIdx(camp.world,camp.boards+1)];return Math.max(1.5,n*n*coolPer())};
const activeMods=()=>[]; // modos serão ligados por mundo, não por loadout
const activeFloor=()=>'';
const modReward=()=>1+(activeMods().reduce((s,k)=>s+MODS[k].r,0)+(activeFloor()?FMODS[activeFloor()].r:0))/100;
const lossPct=()=>Math.min(60,12+activeMods().reduce((s,k)=>s+MODS[k].k,0)+(activeFloor()?FMODS[activeFloor()].k:0));
const COST={
  size:()=>Math.round(SIZE_COST[camp.size+1]*upMul()),cpc:()=>Math.round(18*Math.pow(1.3,camp.cpc)*upMul()),clear:()=>Math.round(45*Math.pow(2.2,camp.clear)*upMul()),
  cool:()=>Math.round(80*Math.pow(2.5,camp.cool)*upMul()),shield:()=>Math.round(40*Math.pow(1.6,camp.shieldBought)),
  drone:i=>Math.round([90,700,6000][i]*Math.pow([1.5,1.55,1.6][i],camp.drones[i]))
};
const fmtC=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':String(Math.floor(n));
function addCoins(n){camp.coins+=n;if(n>0)camp.total+=n;setCoins()}
function setCoins(){
  const c=$('#coinN');c.textContent=fmtC(camp.coins);c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
  const sh=$('#shieldN');if(sh)sh.textContent=':shield: '+camp.shields;
  if(!cardsDirty){cardsDirty=true;requestAnimationFrame(()=>{cardsDirty=false;renderCards()})}
}
function floatText(txt,anchor,cls){
  const r=anchor.getBoundingClientRect(),d=document.createElement('div');d.className='floaty '+(cls||'');d.textContent=txt;
  d.style.left=(r.left+r.width/2)+'px';d.style.top=(r.top+r.height/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
let botActing=false,botOpened=0,botEffNow=.5;
function campPay(x,y){ // moedas por casa segura aberta (agrupadas por jogada)
  const n=campCells;campCells=0;if(!n||tutorial)return;
  let gain=Math.max(1,Math.round(n*cpcVal()*modReward()*worldMult()));
  if(botActing){gain=Math.max(1,Math.round(gain*botEffNow));botOpened+=n}
  const first=camp.total===0;addCoins(gain);floatText('+'+gain,el(x,y),'coin');SFX.coin(n);
  if(first)setTimeout(()=>quip('firstCoin'),700);
}
function startBoardFast(x,y){ // campanha: procura rápida (≈90 ms) por um tabuleiro resolvível, sem zoom nem espera
  const s=y*C+x,t0=performance.now();let best=null;
  for(;;){const m=makeLayout(s),r=analyze(m,s);if(!best||r.frac>best.r.frac)best={m,r};if(best.r.frac>=1||performance.now()-t0>90)break}
  placeLayout(best.m);
  if(campaign&&!tutorial&&(camp.world==='grass'||camp.world==='cave'))placeWeeds(x,y);
  if(campaign&&!tutorial&&camp.world==='forest')placeBushes(x,y);
}

/* ---------- progressão: abas, itens e modos aparecem aos poucos ---------- */
function tabsAvail(){
  const w=camp.wins,s=camp.size,t=[];
  if(w>=1||camp.total>=40)t.push('shop');
  if(camp.losses>=1||w>=5||camp.shields>0)t.push('items');
  if(w>=12||bestSize()>=3||camp.drones.some(n=>n>0)||camp.miners.length)t.push('bots');
  return t;
}
const floorsAvail=()=>false; // loadouts/pisos removidos: cada modo agora pertence a um mundo
function checkUnlocks(silent){
  const now=tabsAvail(),have=camp.tabs||[],added=now.filter(t=>!have.includes(t)),fl=floorsAvail();
  const firstRun=camp.tabs===null;camp.tabs=now;
  if(!silent&&!firstRun){
    added.forEach(t=>{camp.newTab[t]=true});
    if(added.length){quip('unlock_'+added[0]);if(!curTab)curTab=added[0]}
    else if(fl&&!camp.floorsOn&&camp.tabs.includes('loadout'))quip('unlock_floors');
  }
  camp.floorsOn=fl;
  renderTabs();renderCards();
}
function setTab(t,keep){
  curTab=(curTab===t&&!keep)?null:t; // clicar de novo recolhe
  if(curTab)delete camp.newTab[curTab];
  SFX.menu();renderTabs();renderCards();
}
function renderTabs(){
  const box=$('#tabs');if(!box)return;
  const tabs=camp.tabs||[];
  box.hidden=!tabs.length;
  box.innerHTML=tabs.map(k=>`<button class="tab${k===curTab?' sel':''}" data-tab="${k}">${ct(k)}${camp.newTab[k]?'<i class="dot"></i>':''}</button>`).join('')+
    (tabs.includes('items')||camp.shields>0?`<span id="shieldN">:shield: ${camp.shields}</span>`:'');
  renderWorlds();
}
const money=n=>`:coin: ${fmtC(n)}`;
function card(o){
  return `<button class="card${o.cls?' '+o.cls:''}"${o.act?` data-act="${o.act}"`:''}${o.dis?' disabled':''}${o.tip?` title="${o.tip}"`:''}>`+
    `<span class="cic">${o.ic}</span><b>${o.name}</b><small>${o.sub||''}</small>${o.desc?`<em class="cdesc">${o.desc}</em>`:''}<span class="cpr">${o.pr||''}</span></button>`;
}
function renderCards(){
  const box=$('#cards'),info=$('#cardsInfo');if(!box||!camp)return;
  if(!curTab||!(camp.tabs||[]).includes(curTab)){box.innerHTML='';info.textContent='';return}
  const cs=[];info.textContent='';
  const ok=c=>camp.coins>=c?'ok':'';
  if(curTab==='shop'){
    cs.push(card({ic:':coin:',name:ct('cCpc'),sub:ct('lvl',camp.cpc+1),pr:money(COST.cpc()),act:'buy:cpc',dis:camp.coins<COST.cpc(),cls:ok(COST.cpc()),tip:ct('cCpcD',cpcVal()+1),desc:ct('cCpcD',cpcVal()+1)}));
    if(camp.wins>=6){
      cs.push(card({ic:':star:',name:ct('cClear'),sub:ct('lvl',camp.clear+1),pr:money(COST.clear()),act:'buy:clear',dis:camp.coins<COST.clear(),cls:ok(COST.clear()),tip:ct('cClearD',(clearMult()+.25).toFixed(2)),desc:ct('cClearD',(clearMult()+.25).toFixed(2))}));
      cs.push(camp.cool<8?card({ic:':clock:',name:ct('cCool'),sub:ct('lvl',camp.cool+1),pr:money(COST.cool()),act:'buy:cool',dis:camp.coins<COST.cool(),cls:ok(COST.cool()),tip:ct('cCoolD',coolPer(camp.cool+1).toFixed(2)),desc:ct('cCoolD',coolPer(camp.cool+1).toFixed(2))})
        :card({ic:':clock:',name:ct('cCool'),sub:ct('max'),dis:true}));

    if(isCave()){cs.push(card({ic:':hammer:',name:ct('orePick'),sub:ct('lvl',camp.weed+1),pr:money(weedCost()),act:'buy:weed',dis:camp.weed>=weedMax()||camp.coins<weedCost(),cls:camp.weed<weedMax()?ok(weedCost()):'',desc:ct('orePickD',Math.max(1,weedHits()-1))}));
      cs.push((camp.light||0)<LIGHT_MAX?card({ic:':star:',name:ct('lamp'),sub:ct('lvl',(camp.light||0)+1),pr:money(lightCost()),act:'buy:light',dis:camp.coins<lightCost(),cls:ok(lightCost()),desc:ct('lampD',(lightRadius()+.3).toFixed(1))}):card({ic:':star:',name:ct('lamp'),sub:ct('max'),dis:true,desc:ct('lampD',lightRadius().toFixed(1))}))}
    if(camp.world==='grass')cs.push(camp.weed<weedMax()?card({ic:':hammer:',name:ct('weedCut'),sub:ct('lvl',camp.weed+1),pr:money(weedCost()),act:'buy:weed',dis:camp.coins<weedCost(),cls:ok(weedCost()),desc:ct('weedCutD',weedHits()-1)}):card({ic:':hammer:',name:ct('weedCut'),sub:ct('max'),dis:true,desc:ct('weedCutD',weedHits())}));
  }else if(curTab==='items'){
    cs.push(camp.shields<5?card({ic:':shield:',name:ct('cShield'),sub:camp.shields+'/5',pr:money(COST.shield()),act:'buy:shield',dis:camp.coins<COST.shield(),cls:ok(COST.shield()),tip:ct('cShieldD'),desc:ct('cShieldD')})
      :card({ic:':shield:',name:ct('cShield'),sub:'5/5 '+ct('max'),dis:true}));
  }else if(curTab==='bots'){
    DRONES.forEach((d,i)=>{
      if(bestSize()>=d.need)cs.push(card({ic:':drone'+(i+1)+':',name:ct('droneName',d.n),sub:ct('droneD',d.every,d.yield)+(camp.drones[i]?` · x${camp.drones[i]}`:''),pr:money(COST.drone(i)),act:'buy:drone'+i,dis:camp.coins<COST.drone(i),cls:ok(COST.drone(i))}));
      else cs.push(card({ic:':lock:',name:ct('droneName',d.n),sub:ct('unlockBoard',boardAtSize(d.need)),dis:true}));
    });
    if(bestSize()<BOT_NEED&&!camp.miners.length)cs.push(card({ic:':lock:',name:ct('minerBuy'),sub:ct('unlockBoard',boardAtSize(BOT_NEED)),dis:true}));
    else if(roomWorld(camp.world))cs.push(card({ic:minerIcon(),name:ct('minerBuy'),sub:'#'+(camp.miners.length+1),pr:money(MINER_COST.buy()),act:'buy:minerbuy',dis:camp.coins<MINER_COST.buy(),cls:ok(MINER_COST.buy()),desc:ct('minerBuyD',camp.miners.length+1)}));
    else cs.push(card({ic:minerIcon(),name:ct('minerBuy'),sub:ct('max'),dis:true,desc:ct('mMaxWorld')}));
    if(camp.miners.length)cs.push(`<button class="mgrbtn" data-mgr="1">${ct('botMgr')} <span>(${camp.miners.length})</span></button>`);
  }else if(curTab==='loadout'){
    info.textContent=ct('modMult',modReward().toFixed(2),lossPct());
    const mk=(k,m,nm,isFloor)=>{const ds=((isFloor?FLOORS[k]:MODES[k])||{}).desc||'';const un=camp.un[k],okSize=SIZES[camp.size]>=m.min,on=isFloor?camp.eqFloor===k:camp.eq[k];
      if(!un)return card({ic:`<i class="tg">${m.tag}</i>`,name:nm,sub:ct('modD',m.r,m.k),pr:money(m.cost),act:'buy:unl:'+k,dis:camp.coins<m.cost,cls:ok(m.cost),desc:ds});
      return card({ic:`<i class="tg">${m.tag}</i>`,name:nm,sub:okSize?ct('modD',m.r,m.k):ct('needs',m.min),pr:on?ct('equipped'):ct('equip'),act:(isFloor?'eqf:':'eq:')+k,dis:!okSize,cls:on?'on':'',desc:ds})};
    Object.keys(MODS).filter(k=>camp.size>=MODS[k].tier||camp.un[k]).forEach(k=>cs.push(mk(k,MODS[k],MODES[k].name,false)));
    if(floorsAvail())Object.keys(FMODS).filter(k=>camp.size>=FMODS[k].tier||camp.un[k]).forEach(k=>cs.push(mk(k,FMODS[k],ct('floorWord')+' '+FLOORS[k].name,true)));
  }
  box.innerHTML=cs.join('');
}

function minerAct(a){
  const [k,id,key]=a.split(':');let ok=false;
  if(k==='buy'){const c=MINER_COST.buy(),tw=roomWorld(camp.world);if(tw&&camp.coins>=c){camp.coins-=c;camp.miners.push({id:++camp.minerSeq,world:tw,spd:0,pwr:0,pow:0,int:0});ok=true;setTimeout(()=>sayText(ct('botBought'),'😏',false),300)}}
  else if(k==='mw'){const m=minerById(+id);if(m){const own=WORLDS.filter(w=>camp.worlds[w.id]);const i=own.findIndex(w=>w.id===m.world);
    for(let d=1;d<=own.length;d++){const w=own[(i+d)%own.length].id;if(w===m.world||minersIn(w,m)<PER_WORLD){m.world=w;ok=true;SFX.menu();break}}}}
  else if(k==='mu'){const m=minerById(+id);if(m&&m[key]<MINER_MAX[key]){const c=MINER_COST[key](m);if(camp.coins>=c){camp.coins-=c;m[key]++;ok=true}}}
  if(!ok)return;if(k!=='mw')SFX.buy();saveCamp();setCoins();renderCards();if(botmgrOpen())renderBotMgr();
}

function renderBotMgr(){ // todos os bots, do com mais upgrades para o com menos; o jogador designa mundos e compra upgrades aqui
  const box=$('#bmList');if(!box||!camp)return;
  const tot=m=>(m.spd||0)+(m.pwr||0)+(m.pow||0)+(m.int||0);
  const list=[...camp.miners].sort((a,b)=>tot(b)-tot(a)||a.id-b.id);
  const own=WORLDS.filter(w=>camp.worlds[w.id]);
  $('#bmSum').innerHTML=own.map(w=>`<span class="bmw">${w.ic}<b>${ct(WN[w.id])}</b> ${minersIn(w.id)}/${PER_WORLD}</span>`).join('');
  $('#bmTitle').textContent=ct('botMgr');

function buyItem(key){
  let c=0,ok=false;
  if(key==='size'&&camp.size<SIZES.length-1){c=COST.size();if(camp.coins>=c){camp.size++;ok=true;quip('bigger')}}
  else if(key==='cpc'){c=COST.cpc();if(camp.coins>=c){camp.cpc++;ok=true}}
  else if(key==='clear'){c=COST.clear();if(camp.coins>=c){camp.clear++;ok=true}}
  else if(key==='cool'&&camp.cool<8){c=COST.cool();if(camp.coins>=c){camp.cool++;ok=true}}
  else if(key==='shield'&&camp.shields<5){c=COST.shield();if(camp.coins>=c){camp.shields++;camp.shieldBought++;ok=true}}
  else if(key.startsWith('world:')){const id=key.slice(6),w=worldOf(id);c=w.cost;if(w.id!=='mine'&&!camp.worlds[id]&&bestSize()>=w.need&&camp.coins>=c){camp.worlds[id]=true;ok=true;setTimeout(()=>sayText(RES(X('You bought a new world. Pick it on the right. I will pretend to be excited.','Você comprou um mundo novo. Escolha à direita. Vou fingir empolgação.')),'😏',false),300)}}
  else if(key==='light'){c=lightCost();if((camp.light||0)<LIGHT_MAX&&camp.coins>=c){camp.light=(camp.light||0)+1;ok=true}}
  else if(key==='weed'){c=weedCost();if(camp.weed<weedMax()&&camp.coins>=c){camp.weed++;ok=true;
    grid.forEach((row,y)=>row.forEach((g,x)=>{if(g.w>0){g.wmax=Math.max(1,g.wmax-1);g.w=Math.max(1,g.w-1);weedUpdate(y*C+x)}}))}}
  else if(key==='minerbuy'){return minerAct('buy')}
  else if(key.startsWith('drone')){const i=+key.slice(5);c=COST.drone(i);if(camp.coins>=c&&bestSize()>=DRONES[i].need){camp.drones[i]++;ok=true;quip('drone')}}
  else if(key.startsWith('unl:')){const k=key.slice(4),m=MODS[k]||FMODS[k];c=m.cost;if(!camp.un[k]&&camp.coins>=c){camp.un[k]=true;ok=true;quip('unlock')}}
  if(!ok)return;camp.coins-=c;SFX.buy();saveCamp();setCoins();renderYard();checkUnlocks();
  if(!['size','unl','drone'].some(p=>key.startsWith(p))&&Math.random()<.25)quip('buy');
}

function updatePhase(){ // linha em cima do tabuleiro: vai sendo completada a cada tabuleiro até o chefe do mundo
  const t=$('#phaseTxt'),f=$('#phaseFill'),ph=$('#phase');if(!t||!camp)return;
  ph.hidden=false;
  const w=camp.world,thr=BOSS_AT[w],done=worldCleared(w)||!thr,nx=NEXT[w],n=done?(camp.ws[w].ib||0):camp.boards;
  const bossNow=bossOn&&$('#game').classList.contains('boss');

}
const cineWait=ms=>new Promise(r=>setTimeout(r,ms));
function cineSay(t){return new Promise(res=>{
  const c=$('#cine'),tx=$('#cineText');let i=0,tm,typing=true;tx.textContent='';
  const adv=()=>{if(typing){clearTimeout(tm);typing=false;tx.textContent=t}else{c.removeEventListener('click',adv);res()}};
  c.addEventListener('click',adv);
  (function type(){if(!typing)return;i++;tx.textContent=t.slice(0,i);if(i%3===0)SFX.talk();
    if(i<t.length)tm=setTimeout(type,24);else typing=false})();
})}
function cineFly(inward){
  const cf=$('#cineFace'),a=faceEl.getBoundingClientRect(),b=cf.getBoundingClientRect();
  const dx=a.left+a.width/2-(b.left+b.width/2),dy=a.top+a.height/2-(b.top+b.height/2),sc=a.width/b.width;
  const kf=[{transform:`translate(${dx}px,${dy}px) scale(${sc})`},{transform:`translate(${dx*.4}px,${dy*.4-110}px) scale(1.2) rotate(-8deg)`,offset:.45},
    {transform:'translate(0,8px) scale(1.05,.9)',offset:.78},{transform:'none'}];
  if(!inward){kf.reverse();[0,.22,.55,1].forEach((o,i)=>kf[i].offset=o)}
  return cf.animate(kf,{duration:inward?800:520,easing:'ease-in-out',fill:'both'}).finished;
}
async function bossCine(){
  const first=!camp.bossSeen,lines=first?CINE_FIRST:CINE_AGAIN,c=$('#cine'),cf=$('#cineFace');
  hideBuilder();
  setFace('😏');sayText(ct('bossHeh'),'😏',true);
  faceEl.animate([{transform:'rotate(-7deg)'},{transform:'rotate(7deg)'}],{duration:110,iterations:14,direction:'alternate'});
  await cineWait(1600);$('#say').hidden=true;
  cf.textContent='😏';$('#cineText').textContent='';$('#cineHint').textContent=ct('tapHint');
  c.hidden=false;c.animate([{opacity:0},{opacity:1}],{duration:350});
  faceEl.style.visibility='hidden';
  await cineFly(true);SFX.talk();
  for(const [t,m] of lines){cf.textContent=m;if(first&&t===CINE_FIRST[2][0]){updatePhase()}await cineSay(RES(t))}
  cf.textContent='😈';
  const sh=cf.animate([{transform:'translateY(0) rotate(-4deg)'},{transform:'translateY(-14px) rotate(4deg)'}],{duration:130,iterations:16,direction:'alternate'});
  $('#cineText').textContent='HA HA HA HA HA';for(let i=0;i<8;i++){SFX.talk();await cineWait(180)}
  sh.cancel();
  await cineFly(false);
  c.animate([{opacity:1},{opacity:0}],{duration:300}).finished.then(()=>{c.hidden=true});
  faceEl.style.visibility='';setFace('😈');
  setBoss(true);setFace('😈');camp.bossSeen=true;saveCamp();updatePhase();

/* cursor customizado (só com mouse) */
(function(){
  const cur=$('#cur'),svg=cur.querySelector('svg');
  const map=['X','XX','XBX','XBBX','XBBBX','XBBBBX','XBBBBBX','XBBBBBBX','XBBBBXXXX','XBXBBX','XX XBBX','X  XBBX','    XXX'];
  let h='';map.forEach((row,y)=>[...row].forEach((c,x)=>{if(c==='X')h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#04111f"/>`;else if(c==='B')h+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${y<4?'#8ff0ff':y<9?'#38b6ff':'#2b7cff'}"/>`}));
  svg.innerHTML=h;
  let on=false,lx=0,ly=0,lastTr=0,movT;
  const HOT='button,.cell,.card,.tab,[data-act],a,#face,.stat,select,input,label,.mode,.lvl,[data-mact]';
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    if(!on){on=true;document.documentElement.classList.add('hascur');cur.classList.add('on')}
    cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
    cur.classList.add('mov');clearTimeout(movT);movT=setTimeout(()=>cur.classList.remove('mov'),120);
    const t=e.target&&e.target.closest?e.target.closest(HOT):null;cur.classList.toggle('hot',!!t&&!t.disabled);
    const now=performance.now();
    if(now-lastTr>35&&Math.hypot(e.clientX-lx,e.clientY-ly)>6){lastTr=now;
      const d=document.createElement('i');d.className='curtrail';d.style.left=(e.clientX+1)+'px';d.style.top=(e.clientY+3)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),520)}
    lx=e.clientX;ly=e.clientY;
  },{passive:true});
  addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;cur.classList.add('down');
    const r=document.createElement('i');r.className='curring'+(e.button===2?' r':'');r.style.left=e.clientX+'px';r.style.top=e.clientY+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),480)},true);
  addEventListener('pointerup',()=>cur.classList.remove('down'),true);
  document.addEventListener('mouseleave',()=>cur.classList.remove('on'));
  document.addEventListener('mouseenter',()=>{if(on)cur.classList.add('on')});
})();

function weedSVG(){ // pixel art: talos entrelaçados e florzinhas desenhados em grade 12×12 (tudo em pixels inteiros)
  const N=12,cols=['#173f1c','#276f2c','#3a9a3a','#5cc04a'],ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),f=v=>v.toFixed(2);
  let h=`<svg viewBox="0 0 ${N} ${N}">`;
  const px=(x,y,c)=>(x>=0&&y>=0&&x<N&&y<N)?`<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`:'';
  for(let i=0;i<9;i++){ // talos que sobem do chão, ondulando
    let x=ri(0,N-1),tx=ri(0,N-1),g='';const c=cols[i%4],thick=i%3===0;
    for(let y=N-1;y>=ri(0,3);y--){g+=px(x,y,c)+(thick?px(x+1,y,c):'');
      const r=Math.random();x+=r<.3?(tx>x?1:-1):(r<.5?(Math.random()<.5?-1:1):0)}
    h+=`<g data-t="${f(.05+Math.random()*.85)}">${g}</g>`}
  for(let i=0;i<3;i++){ // talos cruzando na horizontal para dar o aspecto entrelaçado
    let y=ri(3,9),g='';const c=cols[(i+1)%4];
    for(let x=0;x<N;x++){g+=px(x,y,c);const r=Math.random();y+=r<.3?-1:(r<.6?1:0)}
    h+=`<g data-t="${f(.05+Math.random()*.85)}">${g}</g>`}
  for(let i=0,n=2+ri(0,1);i<n;i++){ // florzinhas amarelas em posições aleatórias (cruz de 3×3 pixels)
    const cx=ri(1,N-2),cy=ri(1,N-3);
    h+=`<g data-t="${f(.1+Math.random()*.85)}">${px(cx,cy-1,'#ffd166')+px(cx-1,cy,'#ffd166')+px(cx+1,cy,'#ffd166')+px(cx,cy+1,'#ffd166')+px(cx,cy,'#f5b72e')}</g>`}
  return h+'</svg>';
}

   ["....lg....","....lG....","..l.lG....","..g.lG.l..","..gglG.g..","....lGgg..","....lG....","....lG....","....lG....","....lG...."], // saguaro com dois braços
   ["....yp....","....lg....","..l.lG....","..g.lG.l..","..gglG.g..","....lGgg..","....lG....","....lG....","....lG....","....lG...."], // saguaro com florzinha no topo
   ["....pp....","...pyp....","...gggg...","..gllgGg..",".gllsgggG.",".glgggsgG.",".ggggggGG.","..gggGGG..","...GGGG...",".........."], // redondo com flor em cima

    else if(lo[i]===hi[i]&&lo[i]===g.m&&g.f===0)mines.push(i)} // mina provada (valor certo)
  return {safe,mines};
}

function eraseBoard(ms){cells.forEach((c,i)=>{c.style.animationDelay=(i*ms/cells.length)+'ms';c.classList.add('erase')});SFX.build(0)}
function coolTick(){clearInterval(coolT);coolT=setInterval(()=>{coolLeft-=.1;if(coolLeft<=0){endCool();return}updateCool()},100)}
function buildAnim(secs){

  cells.forEach(c=>{c.classList.remove('spawn');c.style.animationDelay='';c.classList.add('hid')});

  const place=k=>{const c=mine[k];if(!c)return;
    c.classList.remove('hid');c.classList.add('built');setTimeout(()=>c.classList.remove('built'),420);
    const r=rects[k];b.hidden=false;b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top+r.height/2)+'px';
    if(k%2===0)SFX.build(k);

    loop()};
  const run=(from,to)=>{for(let k=from;k<to;k++)coolTimers.push(setTimeout(()=>place(k),(k-from)*step));
    coolTimers.push(setTimeout(()=>{if(to>=N){hideBuilder();mine.forEach(c=>c.classList.remove('hid'))}},(to-from)*step+300))}; // garantia: nenhuma casa fica escondida
  if(!boss){run(0,N);return}
  run(0,mid);
  coolTimers.push(setTimeout(()=>{clearInterval(coolT);
    bossCine().then(()=>{if(!campaign)return;

  });
  {const f=frontier();
    if(f&&camp.world!==f&&bossPending()){ // chefe esperando em outro mundo: o Smily avisa (e o mundo pisca) até o jogador ir lutar
      if(!camp.alertAt||Date.now()-camp.alertAt>90000){camp.alertAt=Date.now();sayText(ct('bossWait',ct(WN[f])),'😈',false);renderWorlds()}
    }else if(camp.alertAt){camp.alertAt=0;renderWorlds()}}
  if(++bgTick%8===0&&bgShow>0){floatText('+'+fmtC(bgShow),$('#coinStat'),'coin');bgShow=0}
  const now=Date.now();

  const st=TUT[tutIdx];if(!st)return;
  cells.forEach(c=>c.classList.remove('tgt','tutdim'));
  sayText(mt(RES(st.s)),st.m,true);
  if(st.t){const i=st.t[1]*C+st.t[0];cells.forEach((c,k)=>{const g=grid[k/C|0][k%C];if(k!==i&&!g.o&&!g.f)c.classList.add('tutdim')});cells[i].classList.add('tgt');moveHand(cells[i])}
  else hideHand();
}
function tutGate(kind,x,y){ // só deixa passar a ação que o passo atual pede
  const st=TUT[tutIdx];if(!st)return false;
  const ok=st.act==='free'?(kind==='tap'&&!(x===1&&y===1)):(kind===st.act&&x===st.t[0]&&y===st.t[1]);
  if(!ok){SFX.deny();const t=cells[(st.t?st.t[1]:1)*C+(st.t?st.t[0]:1)];if(st.t&&t){t.classList.remove('nudge');void t.offsetWidth;t.classList.add('nudge')}}
  return ok;
}
function tutAfter(kind){
  const st=TUT[tutIdx];if(!st||st.act==='free'||st.act!==kind)return;
  tutIdx++;SFX.menu();setTimeout(tutShow,450);
}
function startTutorial(){
  clearCool();$('#cool').hidden=true;hideBuilder();campBlock=false;
  tutorial=true;tutIdx=0;
  custom={c:3,r:3,m:1};level='easy';cur=new Set(['classic']);floor='square';shapes=false;
  init();placeLayout(Int8Array.of(0,0,0,0,1,0,0,0,0));started=true; // mina fixa no centro
  tutShow();
}
function tutFinish(){
  tutorial=false;cells.forEach(c=>c.classList.remove('tgt','tutdim'));hideHand();
  camp.tutDone=true;saveCamp();SFX.win();
  sayText(RES(X("Done! Numbers say how many mines touch a cell. Flags are your proof. Tap a number for the shortcut. Now the real thing: no glowing cells. Good luck. You'll need it.","Pronto! Números dizem quantas minas encostam numa casa. Bandeiras são sua prova. Toque num número para o atalho. Agora é de verdade: sem casas brilhando. Boa sorte. Você vai precisar.")),'😈',false);
  setTimeout(()=>{if(!tutorial)campNewBoard()},4200);
}

async function bootCampaign(){
  loadCamp();
  const away=Math.min((Date.now()-camp.last)/1000,2*3600);
  if(!camp.introDone){const r=await introFlow();camp.introDone=true;camp.last=Date.now();saveCamp();enterGame(r&&r.tutorial);if(!(r&&r.tutorial))setTimeout(()=>quip('start'),500);return}
  enterGame();
  const earn=Math.floor(incomePerSec()*away*.5); // offline rende metade, até 2 h
  if(earn>=1&&away>60){
    const v=await ask({emoji:':drone:',title:ct('offT'),text:ct('offP',fmtC(earn)),buttons:[{label:ct('collect'),v:'1'},{label:ct('double'),v:'2',alt:true}]});
    if(v==='2')rewardedAd(()=>{addCoins(earn*2);SFX.buy()});else{addCoins(earn);SFX.buy()}
  }
  camp.last=Date.now();saveCamp();
}

/* ---------- emojis em pixel art: cada emoji vira um sprite 20×20 (sem suavização, poucas cores) ---------- */
const EMO=/(\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}|[\u{1F3FB}-\u{1F3FF}])*)/u;
const EMO_G=new RegExp(EMO.source,'gu');
const TOKS='wcave|wforest|wdesert|wclassic|wgrass|coin|shield|drone1|drone2|drone3|drone|flag|bomb|star|clock|grid|lock|gear|spk|spkoff|warn|hammer|vault|depot|dirt|pick1|pick2|pick3|pick|stone|crystal|hand';
const TOKRE=new RegExp(':('+TOKS+'):'),SPLIT=new RegExp('(:(?:'+TOKS+'):|'+EMO.source.slice(1,-1)+')','u');
const HAS=v=>EMO.test(v)||TOKRE.test(v);
const spriteCache=new Map(),spritePix=new Map(),PXN=20;
function sprite(ch){
  if(spriteCache.has(ch))return spriteCache.get(ch);
  let url=null;
  try{
    const cv=document.createElement('canvas');cv.width=cv.height=PXN;
    const c=cv.getContext('2d',{willReadFrequently:true});
    c.textAlign='center';c.textBaseline='middle';
    c.font=`${Math.round(PXN*.8)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif`;
    c.fillText(ch,PXN/2,PXN/2+1);
    const im=c.getImageData(0,0,PXN,PXN),d=im.data,pix=[];let solid=0;
    for(let i=0;i<d.length;i+=4){
      if(d[i+3]<120){d[i+3]=0;continue}
      d[i+3]=255;solid++;pix.push({x:(i/4)%PXN,y:Math.floor(i/4/PXN),rgb:null,i});
      for(let k=0;k<3;k++)d[i+k]=Math.min(255,Math.round(d[i+k]/64)*64); // paleta reduzida
    }
    if(solid>6){
      c.putImageData(im,0,0);
      // centraliza o desenho no quadrado (os emojis costumam vir deslocados)
      let x0=PXN,x1=0,y0=PXN,y1=0;pix.forEach(q=>{x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y)});
      const dx=Math.round((PXN-1)/2-(x0+x1)/2),dy=Math.round((PXN-1)/2-(y0+y1)/2);
      if(dx||dy){const c2=document.createElement('canvas');c2.width=c2.height=PXN;c2.getContext('2d').drawImage(cv,dx,dy);url=c2.toDataURL()}
      else url=cv.toDataURL();
      pix.forEach(q=>{q.rgb=[d[q.i],d[q.i+1],d[q.i+2]];q.x+=dx;q.y+=dy});spritePix.set(ch,pix);
    }
  }catch(e){}
  spriteCache.set(ch,url);return url;
}
function pixelate(root){
  const nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  for(let n=w.nextNode();n;n=w.nextNode()){
    const t=n.parentNode&&n.parentNode.nodeName;
    if(t==='SCRIPT'||t==='STYLE'||t==='TITLE'||t==='TEXTAREA')continue;
    if(HAS(n.nodeValue))nodes.push(n);
  }
  for(const n of nodes){
    const parts=n.nodeValue.split(SPLIT),frag=document.createDocumentFragment();
    parts.forEach((part,i)=>{
      if(i%2===0){if(part)frag.appendChild(document.createTextNode(part));return}
      const isIcon=part.length>2&&part[0]===':'&&part.endsWith(':');
      const u=isIcon?iconURL(part.slice(1,-1)):sprite(part);
      if(!u){frag.appendChild(document.createTextNode(part));return}
      const img=document.createElement('img');img.className='px';img.src=u;img.alt=part;img.draggable=false;frag.appendChild(img);
    });
    n.parentNode.replaceChild(frag,n);
  }
}
const pxObs=new MutationObserver(ms=>{
  for(const m of ms){
    if(m.type==='characterData'){if(m.target.parentNode&&HAS(m.target.nodeValue))pixelate(m.target.parentNode);continue}
    m.addedNodes.forEach(n=>{if(n.nodeType===3){if(n.parentNode&&HAS(n.nodeValue))pixelate(n.parentNode)}else if(n.nodeType===1&&n.nodeName!=='IMG')pixelate(n)});
  }
});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{
  pixelate(document.body);
  pxObs.observe(document.body,{childList:true,subtree:true,characterData:true});
});
const SANDBOX=/[?&]sandbox/.test(location.search)||location.hash==='#sandbox';
if(SANDBOX)show('menu');else bootCampaign();
